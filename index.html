<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.2, user-scalable=yes">
    <title>Мой сайт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .section {
            min-height: 100vh;
            width: 100vw;
            background-image: url('IMG_1446.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            color: white;
            font-family: sans-serif;
        }

        .section h1 {
            font-size: 3rem;
            text-shadow: 0 2px 10px black;
            -webkit-user-select: none;
            user-select: none;
        }

        .section p {
            font-size: 1.2rem;
            text-shadow: 0 1px 6px black;
            -webkit-user-select: none;
            user-select: none;
        }

        .scroll-hint {
            margin-top: 40px;
            font-size: 2rem;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <section class="section">
        <h1>Добро пожаловать</h1>
        <p>Листай вниз.</p>
        <p class="scroll-hint">↓</p>
    </section>

    <section class="section">
        <h1>Вторая секция</h1>
        <p>Тут твой текст.</p>
        <p class="scroll-hint">↓</p>
    </section>

    <section class="section">
        <h1>Третья секция</h1>
        <p>Ты долистал!</p>
    </section>

</body>
</html>
